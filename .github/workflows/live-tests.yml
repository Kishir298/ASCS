name: Live Tests
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: Run on a provisioned Ollama runner
        type: boolean
        default: false
jobs:
  live-tests:
    if: ${{ inputs.confirm_live && vars.RISALIVE == '1' }}
    runs-on: [self-hosted, ascs-ollama]
    timeout-minutes: 60
    env:
      RISALIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m agent.main --check
      - run: python -m pytest tests/integration/test_ollama_live.py -q -v
