name: CI
on:
  push:
    # Feature and fix branches are validated on push so a candidate commit has
    # evidence before a pull request exists.
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run lint
        run: |
          pip install ruff
          ruff check --select E9,F,I agent tests
      - name: Run tests
        run: |
          python -m pytest -o addopts= -q --tb=no
  test-windows:
    name: Windows full test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run lint
        run: |
          pip install ruff
          ruff check --select E9,F,I agent tests
      - name: Run tests
        run: |
          python -m pytest -o addopts= -q --tb=no
  platform-smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify installed command from another directory
        working-directory: ${{ runner.temp }}
        shell: bash
        # `runner` is not a valid context in job-level env, so the runner's
        # scratch directory is resolved here instead.
        env:
          AGENT_TUI_STATE_PATH: ${{ runner.temp }}/ascs-tui-state.json
        run: |
          ascs --help
          ascs setup
          # CI runners have no Ollama server, so the install smoke validates
          # every local check and explicitly skips the reachability probes.
          # Live Ollama validation runs in live-tests.yml on a provisioned runner.
          ascs doctor --offline "${{ github.workspace }}"
