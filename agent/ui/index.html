<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.S.C.S. — A Smart Coding System</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #161a2e;
    --panel2: #1c2240;
    --border: #272e52;
    --text: #e6e9f5;
    --muted: #8b93b8;
    --accent: #6c8cff;
    --ok: #3ecf7e;
    --warn: #f5b856;
    --err: #ff6b7a;
    --mono: "Cascadia Code", Consolas, "Segoe UI Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand { font-weight: 700; letter-spacing: .04em; font-size: 15px; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .pill {
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 12px; font-size: 12px; background: var(--panel2);
  }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .pill.active { border-color: var(--accent); color: var(--accent); }
  .pill.err { border-color: var(--err); color: var(--err); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .meta { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }
  main { flex: 1; overflow-y: auto; padding: 16px 18px; }
  /* feed */
  .feed { display: flex; flex-direction: column; gap: 10px; max-width: 1100px; margin: 0 auto; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; max-width: 100%; overflow-wrap: anywhere;
  }
  .bubble h5 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  .bubble.tool { border-left: 3px solid var(--accent); }
  .bubble.cmd { border-left: 3px solid var(--warn); background: #10131f; font-family: var(--mono); font-size: 12.5px; }
  .bubble.file { border-left: 3px solid #41c7d4; }
  .bubble.test { border-left: 3px solid #b48cff; }
  .bubble.okx { border-left: 3px solid var(--ok); }
  .bubble.err { border-left: 3px solid var(--err); background: #1b1420; }
  .bubble.think { border-left: 3px dashed var(--muted); color: var(--muted); font-style: italic; }
  .bubble .tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); }
  .bubble .tag.ok  { color: var(--ok); border-color: var(--ok); }
  .bubble .tag.no  { color: var(--err); border-color: var(--err); }
  .bubble pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; }
  .bubble.done { background: #0f1f17; border-color: var(--ok); }
  .time { color: var(--muted); font-size: 11px; flex-shrink: 0; padding-top: 3px; }
  .thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-style: italic; }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .modes { display: flex; gap: 6px; }
  .modes button {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 14px; cursor: pointer; font-weight: 600;
  }
  .modes button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .inputrow { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; height: 46px; background: var(--panel2);
    color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.act {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-weight: 600; cursor: pointer;
  }
  button.stop { background: var(--err); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .plan { white-space: pre-wrap; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <div class="brand">A.S.C.S.<small>A Smart Coding System</small></div>
  <span class="pill warn" id="pillState">IDLE</span>
  <span class="pill" id="pillMode">AUTO</span>
  <span class="pill" id="pillSrv">connecting…</span>
  <div class="meta" id="metaInfo">–</div>
</header>

<main id="main">
  <div class="feed" id="feed">
    <div class="empty" id="emptyHint">A.S.C.S. ready. Type a task and press Send, or press the STOP button to cancel a run.</div>
  </div>
</main>

<footer>
  <div class="modes" id="modes">
    <button data-mode="PLAN">PLAN</button>
    <button data-mode="BUILD">BUILD</button>
    <button data-mode="AUTO" class="on">AUTO</button>
  </div>
  <div class="inputrow">
    <label class="sr-only" for="taskInput">Task</label>
    <textarea id="taskInput" placeholder="Describe a coding task… e.g. add a --dry-run flag to the CLI and test it"></textarea>
    <button class="act" id="sendBtn">Send</button>
    <button class="act stop" id="stopBtn" disabled>STOP</button>
    <button class="ghost" id="clearBtn">Clear</button>
  </div>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const feed = $("feed");
let currentMode = "AUTO";
let busy = false;
let stateLabel = "IDLE";
let historySeen = 0;

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

function now() { return new Date().toLocaleTimeString([], { hour12: false }); }

function push(kind, html) {
  if ($("emptyHint")) $("emptyHint").remove();
  const row = document.createElement("div");
  row.className = "row";
  const b = document.createElement("div");
  b.className = "bubble " + kind;
  b.innerHTML = html;
  row.appendChild(b);
  const t = document.createElement("span");
  t.className = "time";
  t.textContent = now();
  row.appendChild(t);
  feed.appendChild(row);
  feed.scrollTop = feed.scrollHeight;
  return row;
}
function pushPre(kind, title, text, tag) {
  const tagHtml = tag ? `<span class="tag ${tag.cls}">${esc(tag.txt)}</span> ` : "";
  return push(kind,
    `<h5>${esc(title)} ${tagHtml}</h5><pre>${esc(text)}</pre>`);
}

function setState(state) {
  stateLabel = (state || "IDLE").toUpperCase();
  const pill = $("pillState");
  pill.textContent = stateLabel;
  pill.className = "pill " + (stateLabel === "COMPLETE" ? "ok" : stateLabel === "FAILED" ? "err" : stateLabel === "CANCELLED" || stateLabel === "TIMEOUT" ? "warn" : stateLabel === "IDLE" ? "warn" : "active");
}
function setBusy(b) {
  busy = b;
  $("sendBtn").disabled = b;
  $("stopBtn").disabled = !b;
}

function handleEvent(e) {
  if (!e || !e.type) return;
  const ts = e.timestamp ? new Date(Math.round(e.timestamp * 1000)).toLocaleTimeString([], { hour12: false }) : now();
  switch (e.type) {
    case "status":
      if (e.status) setState(e.status.replace(/\s+/g, "_"));
      if (e.message && e.message !== e.status) push("tool", `<pre>${esc(e.message)}</pre>`);
      break;
    case "mode_changed":
      if (e.mode) selectMode(e.mode.toUpperCase());
      break;
    case "agent_started":
      push("okx", `<h5>Agent started</h5><pre>${esc(e.message || "")}</pre>`);
      break;
    case "agent_thinking":
      if ((e.message || "").toLowerCase().includes("respond")) break;
      push("think", `<span class="thinking"><span class="spinner"></span> model thinking…</span>`);
      break;
    case "tool_started":
      push("tool", `<h5>Tool started</h5><pre>${esc(e.tool || "")} ${esc(e.target || "")}</pre>`);
      break;
    case "tool_completed":
      push("tool", `<h5>Tool finished</h5><span class="tag ${e.ok ? "ok" : "no"}">${e.ok ? "OK" : "FAILED"}</span> <span class="tag">${esc(e.elapsed != null ? e.elapsed.toFixed(2) + "s" : "")}</span> <pre>${esc(e.tool || "")} ${esc(e.target || "")}</pre>`);
      break;
    case "command_started":
    case "test_started":
      push("cmd", `<h5>${e.type.endsWith("started") ? "Running" : ""} command</h5><pre>${esc(e.command || "")}</pre>`);
      break;
    case "command_completed":
    case "test_completed":
      push("cmd", `<h5>${e.type.replace("_completed", " result")} · exit ${e.exit_code ?? "?"}</h5><span class="tag ${e.ok ? "ok" : "no"}">${e.ok ? "PASS" : "FAIL"}</span> <span class="tag">${esc(e.elapsed != null ? e.elapsed.toFixed(2) + "s" : "")}</span>`);
      break;
    case "file_read": case "file_written": case "patch_applied":
    case "file_deleted": case "file_moved": case "file_copied":
      push("file", `<h5>${esc(e.type.replace(/_/g, " "))}</h5><span class="tag ${e.ok ? "ok" : "no"}">${e.ok ? "OK" : "FAILED"}</span> <pre>${esc(e.target || "")}</pre>`);
      break;
    case "agent_completed":
      setState("COMPLETE");
      push("done", `<h5>Complete</h5><pre>${esc(e.summary || e.message || "")}</pre>`);
      setBusy(false);
      break;
    case "agent_stopped":
      setState("CANCELLED");
      push("err", `<h5>Cancelled / stopped</h5><pre>${esc(e.message || "")}</pre>`);
      setBusy(false);
      break;
    case "agent_error":
    case "activity":
      if (e.type === "agent_error") {
        setState("FAILED");
        push("err", `<h5>Error</h5><pre>${esc(e.error || e.message || "")}</pre>`);
        setBusy(false);
      } else {
        push("tool", `<pre>${esc(e.message || "")}</pre>`);
      }
      break;
    case "server":
      $("pillSrv").className = "pill ok";
      $("pillSrv").textContent = "server " + esc(e.version || "");
      if (e.state) applyState(e.state);
      break;
    default:
      if (e.message) push("tool", `<pre>${esc(e.message)}</pre>`);
  }
}

function applyState(s) {
  if (!s) return;
  setState(s.state);
  if (s.mode) selectMode(s.mode.toUpperCase());
  setBusy(!!s.busy);
  const meta = [];
  if (s.state_label) meta.push("state " + s.state_label);
  if (s.elapsed != null && s.elapsed > 0) meta.push(Math.round(s.elapsed) + "s elapsed");
  if (s.result) {
    if (s.result.status) meta.push("result " + s.result.status.toUpperCase());
    if (s.result.iterations) meta.push(s.result.iterations + " iters");
    if (s.result.plan && s.result.plan.steps && s.result.plan.steps.length) {
      renderPlan(s.result.plan);
      meta.push(s.result.plan.steps.length + " plan steps");
    }
  }
  $("metaInfo").textContent = meta.join(" · ");
}

function renderPlan(plan) {
  if (!plan) return;
  const existing = $("planBubble");
  if (existing) existing.remove();
  const lines = ["Goal: " + (plan.goal || "–")].concat(plan.steps.map((s, i) => (i + 1) + ". " + s));
  const row = document.createElement("div");
  row.className = "row";
  row.id = "planBubble";
  const b = document.createElement("div");
  b.className = "bubble tool";
  b.innerHTML = `<h5>Plan</h5><div class="plan">${esc(lines.join("\n"))}</div>`;
  row.appendChild(b);
  feed.insertBefore(row, feed.firstChild);
}

function selectMode(m) {
  currentMode = m;
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  $("pillMode").textContent = m;
}

function send() {
  if (busy) return;
  const text = $("taskInput").value.trim();
  if (!text) return;
  $("taskInput").value = "";
  setBusy(true);
  setState("RECEIVING_TASK");
  push("tool", `<h5>Task received</h5><pre>${esc(text)}</pre>`);
  fetch("/api/task", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ task: text, mode: currentMode })
  }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (r.status === 409) { push("err", `<h5>Busy</h5><pre>Another run is still active.</pre>`); setBusy(false); }
    else if (!r.ok) { push("err", `<h5>Task rejected</h5><pre>${esc(data.error || r.status)}</pre>`); setBusy(false); }
  }).catch(() => {
    setBusy(false);
    $("pillSrv").className = "pill err";
    $("pillSrv").textContent = "server disconnected";
    push("err", `<h5>Connection lost</h5><pre>Could not reach the A.S.C.S. server.</pre>`);
  });
}

function stop() {
  fetch("/api/stop", { method: "POST" }).catch(() => {});
  setState("CANCELLED");
  push("err", `<h5>Stop requested</h5><pre>Cancelling the active run…</pre>`);
}

// ---- wiring ----
$("sendBtn").addEventListener("click", send);
$("stopBtn").addEventListener("click", stop);
$("clearBtn").addEventListener("click", () => {
  fetch("/api/clear", { method: "POST" }).then(() => {
    feed.innerHTML = `<div class="empty" id="emptyHint">History cleared.</div>`;
    stateLabel = "IDLE";
    applyState($("pillSrv") && $("metaInfo") ? { state: "idle" } : {});
  }).catch(() => {});
});
$("taskInput").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); send(); }
});
document.querySelectorAll("#modes button").forEach((b) =>
  b.addEventListener("click", () => selectMode(b.dataset.mode)));

// load history, then stream live events
fetch("/api/history").then((r) => r.json()).then((h) => {
  var seen = new Set();
  (h.events || []).forEach((e) => { seen.add(e.type + ":" + e.timestamp); handleEvent(e); });
}).catch(() => {});

const sse = new EventSource("/api/events");
sse.addEventListener("event", (ev) => {
  const e = JSON.parse(ev.data);
  handleEvent(e);
  if (e.type === "server") selectMode(e.state && e.state.mode ? e.state.mode : currentMode);
});
sse.addEventListener("server", (ev) => handleEvent(JSON.parse(ev.data)));
sse.onerror = () => {
  $("pillSrv").className = "pill err";
  $("pillSrv").textContent = "server disconnected";
};

setInterval(() => {
  fetch("/api/state").then((r) => r.json()).then(applyState).catch(() => {});
}, 1500);
fetch("/api/status").then((r) => r.json()).then((s) => {
  if (s.ollama) {
    const o = s.ollama;
    $("pillSrv").className = "pill " + (o.reachable ? "ok" : "err");
    $("pillSrv").textContent = (o.reachable ? "ollama ✓ · " : "ollama ✗ · ") + o.model;
    $("metaInfo").textContent = "workspace " + s.workspace;
    selectMode((s.mode || "AUTO").toUpperCase());
  }
}).catch(() => {});
applyState({ state: "IDLE", mode: "AUTO" });
</script>
</body>
</html>
